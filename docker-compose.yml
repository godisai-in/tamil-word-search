# Word Search (production): Django/gunicorn + OpenSearch (kNN) + SQLite (relations, read-only).
# TLS and the public hostname are handled by YOUR Caddy on the host (see deploy/Caddyfile):
#   Caddy :443 -> 127.0.0.1:${WEB_PORT} (this stack) ; OpenSearch is never published.
#
#   cp .env.example .env && edit it         # secrets are required: the stack refuses to start without them
#   make check                              # host prerequisites
#   docker compose up -d --build            # opensearch + web
#   docker compose --profile load run --rm loader     # one-off: load the vectors
name: wordsearch

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }      # without this, container logs grow without limit

x-app-env: &app-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env},localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_ADDRESS}
  WORDSEARCH_VECTOR_BACKEND: opensearch
  OPENSEARCH_URL: https://opensearch:9200
  OPENSEARCH_USER: admin
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in .env}
  OPENSEARCH_INDEX: words                          # an alias; the loader points it at words_vN
  # The image's demo certificate is self-signed and this link stays on the private network. If OpenSearch
  # ever moves to another host, give it a real certificate and set this to "1".
  OPENSEARCH_VERIFY_CERTS: "0"

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.1}
    restart: unless-stopped
    init: true
    logging: *logging
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms${OS_HEAP:-2g} -Xmx${OS_HEAP:-2g}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in .env}
      bootstrap.memory_lock: "true"                # keep the JVM heap out of swap; "false" if the host forbids memlock
    mem_limit: ${OS_MEM_LIMIT:-5g}                 # heap + off-heap vector index; raise it together with OS_HEAP
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    networks: [backend]                            # internal: no route in from, or out to, the internet
    stop_grace_period: 60s                         # let it flush before SIGKILL
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  web:
    build: .
    image: wordsearch:local
    restart: unless-stopped
    init: true
    logging: *logging
    environment:
      <<: *app-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    ports:
      - "127.0.0.1:${WEB_PORT:-8010}:8000"         # loopback only: your host Caddy is the single public entry point
    volumes:
      - ${WORDS_DB:-./out/words.db}:/data/words.db:ro      # relations + sources (SQLite, read-only)
    depends_on:
      # Ordering only. Search works without vectors, so an OpenSearch restart must not block or kill the site.
      opensearch: { condition: service_started }
    networks: [backend, edge]
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s

  # One-shot: unpickles embeddings.pkl (needs ~3 GB RAM), creates the index, bulk-loads, checks the count,
  # then points the alias `words` at it. Safe to re-run (document ids are deterministic).
  loader:
    image: wordsearch:local
    build: .
    profiles: ["load"]
    restart: "no"
    environment:
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in .env}
    volumes:
      - ${EMBEDDINGS_PKL:-./out/embeddings.pkl}:/data/embeddings.pkl:ro
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [backend]
    command:
      - python
      - /app/pipeline/upload_to_opensearch.py
      - --pkl=/data/embeddings.pkl
      - --host=https://opensearch:9200
      - --index=${OS_INDEX_VERSION:-words_v1}
      - --alias=words
      - --create
      - --no-verify-certs

networks:
  backend:
    internal: true          # OpenSearch lives here
  edge: {}                  # lets `web` publish its loopback port

volumes:
  osdata:
